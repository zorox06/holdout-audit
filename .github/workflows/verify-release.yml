name: Verify PyPI release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the published package from PyPI
        run: python -m pip install --no-cache-dir --index-url https://pypi.org/simple spliv==0.1.0
      - name: Check installed API and both CLI gates
        shell: python
        run: |
          import subprocess
          import spliv
          assert spliv.__version__ == '0.1.0'
          subprocess.run(['spliv', 'demo', '--clean', '--fail-on', 'warning', '--output', 'clean.html'], check=True)
          result = subprocess.run(['spliv', 'demo', '--fail-on', 'warning', '--output', 'flagged.html'])
          assert result.returncode == 1, result.returncode
