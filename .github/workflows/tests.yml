name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test real CSVs, exports, and CLI behavior
        run: python -m unittest discover -s tests -v
      - name: Build and install the package
        run: python -m pip install .
      - name: Smoke-test installed entry point and bundled data
        working-directory: ${{ runner.temp }}
        run: spliv demo --clean --fail-on warning --output installed-demo.html

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[notebook]' nbclient nbformat ipykernel
      - name: Test pandas inputs, notebook display, and training gates
        run: python -m unittest discover -s tests -v
      - name: Execute Colab notebook end to end
        run: python tools/check_notebooks.py
